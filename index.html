function aord(){return `<p class=mu>Buyurtmalar mijozning qurilmasida saqlanadi va Telegram orqali sizga yetib boradi. Bu yerda faqat shu qurilmadagi buyurtmalar ko'rinadi.</p><div class=tbl><table>${OR.map((o,i)=>`<tr><td>${o.id}<br><span class=mu>${esc(o.at.slice(0,10))}</span></td><td>${esc(o.name)}<br><span class=mu>${esc(o.phone)}</span></td><td>${fmt(o.total)}</td><td><select data-os=${i}>${so(['Menejer tasdig\'ini kutmoqda','Tasdiqlandi','Yetkazilmoqda','Yetkazildi','Bekor qilindi'].map(x=>[x,x]),o.status)}</select></td></tr>`).join('')||'<tr><td class=mu>Buyurtmalar yo\'q</td></tr>'}</table></div>`}
const bl=l=>l.map(b=>b[0]+'-'+(b[1]>=1e12?'':b[1])).join('\n'),pbl=s=>s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const [a,b]=x.split('-').map(y=>+y.replace(/\D/g,'')||0);return[a,b||1e12]});
function aset(){return `<div class=box><div class=row><input id=s1 value="${esc(ST.tg)}" placeholder="Telegram menejer"><input id=s2 value="${esc(ST.ch)}" placeholder="Telegram kanal URL"><input id=s3 value="${esc(ST.ig)}" placeholder="Instagram URL"><input id=s4 value="${esc(ST.ph)}" placeholder="Telefon"></div><br><textarea id=s5 rows=2 style="width:100%" placeholder="Yetkazib berish ma'lumoti">${esc(ST.dl)}</textarea><div class=row style="margin-top:8px;align-items:flex-start"><div>Smartfon byudjeti<br><textarea id=s6 rows=6>${esc(bl(ST.bg))}</textarea></div><div>Gadget byudjeti<br><textarea id=s7 rows=6>${esc(bl(ST.gbg))}</textarea></div></div><p class=mu>Har qatorda: min-maks (oxirgisida maks bo'sh qoldiring).</p><div class=row><button class=btn data-act=sset>Saqlash</button><button class=ghost data-act=reset>Demo ma'lumotni tiklash</button></div></div>`}
function abak(){return `<div class=box><p class=mu>Zaxira mahsulotlar, promokodlar, sozlamalar va rasm havolalarini o'z ichiga oladi.</p><button class=btn data-act=bex>Zaxira yaratish</button> <button class=ghost data-act=bcp>Nusxalash</button><br><br><textarea id=bt rows=6 style="width:100%" placeholder="Zaxira matni shu yerda"></textarea><br><br><button class=ghost data-act=bim>Zaxiradan tiklash</button></div>`}
// router
function go(r){location.hash=r}
function render(){nav();ft();const h=(location.hash||'#home').slice(1);if(!READY){$('#app').innerHTML='<p class=mu>Yuklanmoqda...</p>';return}
let v;if(h.startsWith('p-'))v=prod(h.slice(2));else v=({home,catalog,smart,cart,admin,done,wish,compare}[h]||home)();$('#app').innerHTML=v;window.scrollTo(0,0)}
const rr=()=>{if(!READY)return;const y=scrollY;nav();ft();const h=(location.hash||'#home').slice(1);$('#app').innerHTML=h.startsWith('p-')?prod(h.slice(2)):({home,catalog,smart,cart,admin,done,wish,compare}[h]||home)();scrollTo(0,y)};
addEventListener('hashchange',()=>{S.c=S.m=S.g=0;if((location.hash||'').slice(1)!='admin'&&S.ed&&S.dirty&&!confirm('Saqlanmagan o\'zgarishlar bor. Chiqilsinmi?')){history.back();return}if((location.hash||'').slice(1)!='admin')S.ed=null;render()});
const gp=(o,p)=>p.split('.').reduce((a,k)=>a[k],o);
const sp=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x],o)[l]=v};

document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const d=t.dataset,a=d.act,i=+d.i;
if(a=='go')go(d.r);else if(a=='open')go('p-'+d.p);
else if(a=='th'){TH=TH=='dark'?'light':'dark';sv('arc2_th',TH);document.documentElement.dataset.theme=TH;nav()}
else if(a=='share'){const u=location.href.split('#')[0]+'#p-'+d.p;(navigator.share?navigator.share({url:u}):Promise.reject()).catch(()=>navigator.clipboard.writeText(u).then(()=>toast('Havola nusxalandi'),()=>toast(u)))}
else if(a=='fav'){tog(FV,d.p)?toast('Sevimlilarga qo\'shildi'):toast('Sevimlilardan olindi');sync();rr()}
else if(a=='cmp'){if(!CP.includes(d.p)&&CP.length>=3){toast('Eng ko\'pi bilan 3 ta mahsulot');return}tog(CP,d.p);sync();rr()}
else if(a=='cat'){S.f.cat=d.c;location.hash=='#catalog'?rr():go('catalog')}
else if(a=='col'){S.c=i;S.g=0;rr()}else if(a=='mem'){S.m=i;rr()}else if(a=='gal'){S.g=+d.k;rr()}
else if(a=='add'){addC(d.p,S.c,S.m);nav();toast('Savatga qo\'shildi')}else if(a=='buy'){addC(d.p,S.c,S.m);go('cart')}
else if(a=='clr'){S.f={q:'',cat:'',brand:'',os:'',gb:'',max:'',disc:0,sort:'new'};rr()}
else if(a=='sans'){S.sm.a.push({v:qn().o[+d.j][1]});rr()}else if(a=='snext'){S.sm.a.push({v:$('#sx').value});rr()}
else if(a=='sback'){S.sm.a.pop();rr()}else if(a=='srst'){S.sm.a=[];rr()}else if(a=='sbuy'){addC(d.p,0,i);go('cart')}
else if(a=='qty'){CT[i].q=Math.max(1,CT[i].q+ +d.d);sync();rr()}else if(a=='rm'){CT.splice(i,1);sync();rr()}
else if(a=='promo'){(async()=>{const c=$('#pc').value.trim().toUpperCase();let x=PR.find(y=>y.code==c);if(!x&&sb&&!OWN){const r=await sb.rpc('check_promo',{p_code:c});x=r.data||null}const er=perr(x,totals());if(er){S.promo=null;rr();$('#pe').textContent=er}else{S.promo=x;rr();toast('Promokod qo\'llandi')}})()}
else if(a=='order')order();
else if(a=='cpy')navigator.clipboard.writeText(decodeURIComponent(d.t)).then(()=>toast('Nusxalandi'),()=>toast('Nusxalab bo\'lmadi'));
else if(a=='login')login();else if(a=='logout'){sb.auth.signOut().then(()=>{location.hash='home';location.reload()})}
else if(a=='tab'){if(S.ed&&S.dirty&&!confirm('Saqlanmagan o\'zgarishlar bor. Davom etilsinmi?'))return;S.ed=null;S.dirty=0;S.tab=d.t;sv('arc3_tab',d.t);rr()}
else if(a=='enew'){S.ed=NEW();S.dirty=0;rr()}
else if(a=='eopen'){const p=JSON.parse(JSON.stringify(P.find(x=>x.id==d.p)));p.st=(p.specs||[]).map(s=>s.join(': ')).join('\n');S.ed=p;S.dirty=0;rr()}
else if(a=='ecancel'){if(S.dirty&&!confirm('Saqlanmagan o\'zgarishlar yo\'qoladi. Davom etilsinmi?'))return;S.ed=null;S.dirty=0;rr()}
else if(a=='ecadd'){S.ed.colors.push({n:'Yangi rang',h:'#888888',imgs:[]});S.dirty=1;rr()}
else if(a=='ecdel'){if(S.ed.colors.length>1){S.ed.colors.splice(i,1);S.dirty=1;rr()}else toast('Kamida bitta rang kerak')}
else if(a=='emadd'){S.ed.mem.push({gb:0,p:0,s:0});S.dirty=1;rr()}
else if(a=='emdel'){if(S.ed.mem.length>1){S.ed.mem.splice(i,1);S.dirty=1;rr()}else toast('Kamida bitta konfiguratsiya kerak')}
else if(a=='imd'){S.ed.colors[i].imgs.splice(+d.k,1);S.dirty=1;rr()}
else if(a=='imv'){const l=S.ed.colors[i].imgs,k=+d.k,n=k+ +d.d;if(n>=0&&n<l.length){[l[k],l[n]]=[l[n],l[k]];S.dirty=1;rr()}}
else if(a=='imp'){const l=S.ed.colors[i].imgs;l.unshift(l.splice(+d.k,1)[0]);S.dirty=1;rr()}
else if(a=='esave')esave();
else if(a=='pub'){const p=P.find(x=>x.id==d.p);p.pub=p.pub?0:1;sync();rr()}
else if(a=='prev')go('p-'+d.p);
else if(a=='dup'){const p=JSON.parse(JSON.stringify(P.find(x=>x.id==d.p)));p.id=p.id+'-nusxa-'+Date.now().toString(36);p.name+=' (nusxa)';p.pub=0;p.t=Date.now();P.push(p);sync();rr()}
else if(a=='del'){if(confirm('Mahsulot butunlay o\'chirilsinmi?')){const p=P.find(x=>x.id==d.p);P=P.filter(x=>x.id!=d.p);sync();rr()}}
else if(a=='addpr'){const c=$('#cc').value.trim().toUpperCase(),v=+$('#cv').value,ty=$('#ct').value;if(!/^[A-Z0-9]{3,20}$/.test(c)||!(v>0)||(ty=='pct'&&v>100)||PR.some(x=>x.code==c)){toast('Kod (3–20 harf/raqam), qiymat to\'g\'ri va takrorlanmas bo\'lishi kerak');return}PR.push({code:c,type:ty,val:v,min:+$('#cm').value||0,on:1,cat:$('#ccat').value,pids:[...$('#cp').selectedOptions].map(o=>o.value),from:$('#cf').value,to:$('#ce').value});sync();rr()}

else if(a=='sset'){ST.tg=$('#s1').value.trim().replace(/^@/,'')||ST.tg;ST.ch=$('#s2').value.trim()||ST.ch;ST.ig=$('#s3').value.trim()||ST.ig;ST.ph=$('#s4').value.trim();ST.dl=$('#s5').value.trim()||ST.dl;const b=pbl($('#s6').value),g=pbl($('#s7').value);if(b.length)ST.bg=b;if(g.length)ST.gbg=g;sync();toast('Saqlandi');rr()}
else if(a=='reset'){if(confirm('Demo ma\'lumot tiklansinmi? Mahsulotlar va promokodlar almashtiriladi.')){P=SEED();PR=PRS();sync();rr()}}
else if(a=='bex'){$('#bt').value=JSON.stringify({v:3,P,PR,ST})}
else if(a=='bcp'){navigator.clipboard.writeText($('#bt').value).then(()=>toast('Nusxalandi'),()=>toast('Nusxalab bo\'lmadi'))}
else if(a=='bim'){try{const j=JSON.parse($('#bt').value);if(!Array.isArray(j.P)||!Array.isArray(j.PR))throw 0;if(!confirm('Joriy ma\'lumot almashtiriladi. Davom etilsinmi?'))return;P=j.P;PR=j.PR;ST=Object.assign(ST,j.ST||{});sync();toast('Tiklandi');rr()}catch(x){toast('Zaxira matni noto\'g\'ri')}}});
function addC(id,c,m){const k=CT.find(x=>x.p==id&&x.c==c&&x.m==m);k?k.q++:CT.push({p:id,c,m,q:1});sync()}
function esave(){const d=S.ed,e=[];if(!d.name.trim())e.push('Nomi kerak');if(!d.brand.trim())e.push('Brend kerak');
d.mem.forEach(m=>{if(!(m.p>0))e.push('Narx 0 dan katta bo\'lishi kerak');else if(m.s&&m.s>=m.p)e.push('Chegirmali narx asl narxdan past bo\'lishi kerak')});

if(!d.colors.every(c=>c.n.trim()))e.push('Rang nomlarini kiriting');
if(P.some(p=>p.name.toLowerCase()==d.name.trim().toLowerCase()&&p.id!=d.id))e.push('Bunday nomli mahsulot allaqachon bor');
if(e.length){$('#ee').textContent=[...new Set(e)].join('. ');return}
const o=JSON.parse(JSON.stringify(d));o.specs=d.st.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{const i=x.indexOf(':');return i<0?[x,'']:[x.slice(0,i).trim(),x.slice(i+1).trim()]});delete o.st;
if(o._new){o.id=(o.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'mahsulot')+'-'+Date.now().toString(36);delete o._new;P.push(o)}else P[P.findIndex(p=>p.id==o.id)]=o;

const WEBP=(()=>{try{return document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')}catch(e){return false}})();
const EXT={'image/webp':'webp','image/jpeg':'jpg','image/png':'png'};
async function bmp(f){try{return await createImageBitmap(f)}catch(e){return await new Promise((ok,no)=>{const i=new Image(),u=URL.createObjectURL(f);i.onload=()=>{URL.revokeObjectURL(u);ok(i)};i.onerror=no;i.src=u})}}
const dim=b=>[b.width||b.naturalWidth,b.height||b.naturalHeight];
function rs(b,w,h){let s=b,[cw,ch]=dim(b);while(cw>w*2){const nw=Math.round(cw/2),nh=Math.round(ch/2),c=document.createElement('canvas');c.width=nw;c.height=nh;const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(s,0,0,nw,nh);s=c;cw=nw;ch=nh}
const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');if(!WEBP){x.fillStyle='#fff';x.fillRect(0,0,w,h)}x.imageSmoothingQuality='high';x.drawImage(s,0,0,w,h);return c}
const toB=c=>new Promise(r=>c.toBlob(r,WEBP?'image/webp':'image/jpeg',.92));
async function upImg(f){if(!sb)throw new Error('server ulanmagan');
const b=await bmp(f),[W,H]=dim(b),L=Math.max(W,H),id=Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let big=f,o=1,w=W,h=H;
if(L>2400){const k=2400/L;w=Math.round(W*k);h=Math.round(H*k);const nb=await toB(rs(b,w,h));if(nb){big=nb;o=0}else{w=W;h=H}}
else if(f.size>3.5e6){const nb=await toB(rs(b,W,H));if(nb&&nb.size<f.size*.9){big=nb;o=0}}
let th=null;if(W>720||H>960){const k=Math.min(720/W,960/H),nb=await toB(rs(b,Math.round(W*k),Math.round(H*k)));if(nb)th=nb}
const put=async(n,bl)=>{const r=await sb.storage.from('images').upload(n,bl,{contentType:bl.type||f.type,cacheControl:'31536000'});if(r.error)throw r.error;return sb.storage.from('images').getPublicUrl(n).data.publicUrl};
const p=id+'.'+(EXT[big.type]||'jpg'),x={id:p,u:await put(p,big),w,h,kb:Math.round(big.size/1024),o};
if(th)x.t=await put(id+'_t.'+(EXT[th.type]||'jpg'),th);
return x}

render();
